<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e293b; padding: 2rem; border-radius: 8px; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 1.5rem; color: #38bdf8; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #94a3b8; }
        input { width: 100%; padding: 0.6rem; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: white; font-size: 1rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 0.75rem; background: #38bdf8; border: none; border-radius: 4px; color: #0f172a; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #0ea5e9; }
        .msg { margin-top: 1rem; text-align: center; font-size: 0.85rem; }
        .error { color: #f43f5e; }
        .success { color: #10b981; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login / Signup</h2>
        <form id="form">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit">Submit</button>
            <div id="msg" class="msg"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/save-cred', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    msg.className = 'msg success';
                    msg.textContent = 'Credentials saved successfully!';
                    form.reset();
                } else {
                    msg.className = 'msg error';
                    msg.textContent = data.message || 'Error saving credentials.';
                }
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = 'Network or server error.';
            }
        });
    </script>
</body>
</html>
